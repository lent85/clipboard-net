[package]
name = "clipboard-net"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Cross-platform clipboard synchronization with rich status telemetry and multi-transport support"

[lib]
name = "clipboard_net_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-dialog = "2"
tauri-plugin-notification = "2"
tauri-plugin-opener = "2"
tauri-plugin-autostart = "2"
clipnet-core = { path = "../crates/clipnet-core" }
clipnet-hub = { path = "../crates/clipnet-hub" }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
uuid = { workspace = true }
async-trait = { workspace = true }
rustls = { workspace = true }
chrono = { workspace = true }
urlencoding = { workspace = true }
