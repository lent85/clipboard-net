name: Feature Request
description: Suggest a new feature or enhancement for ClipboardNet
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem Statement
      description: What problem or workflow gap does this feature solve?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed Solution
      description: Describe how you envision this feature working.
    validations:
      required: true

  - type: checkboxes
    id: platforms
    attributes:
      label: Target Platforms
      options:
        - label: Ubuntu / Linux
        - label: Windows 10 / 11
        - label: Standalone clipnet-hub / Docker

