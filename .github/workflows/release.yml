name: Release

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/v') }}

jobs:
  verify-tag:
    name: Verify Version Alignment
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Check tag matches Cargo.toml, package.json, and tauri.conf.json
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          TAG_VER="${GITHUB_REF_NAME#v}"
          python3 - "$TAG_VER" <<'PY'
          import json, pathlib, sys, tomllib

          tag_ver = sys.argv[1]
          cargo_ver = tomllib.loads(pathlib.Path("Cargo.toml").read_text())["workspace"]["package"]["version"]
          pkg_ver = json.loads(pathlib.Path("package.json").read_text())["version"]
          tauri_ver = json.loads(pathlib.Path("src-tauri/tauri.conf.json").read_text())["version"]

          versions = {
              "tag": tag_ver,
              "Cargo.toml": cargo_ver,
              "package.json": pkg_ver,
              "src-tauri/tauri.conf.json": tauri_ver,
          }
          print("Detected versions:", versions)
          if len(set(versions.values())) != 1:
              sys.exit(f"Version mismatch detected: {versions}")
          PY

  build-packages:
    name: Build ${{ matrix.name }}
    needs: verify-tag
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x86_64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact_name: release-windows-x86_64
            hub_bin: clipnet-hub.exe
            hub_asset: clipnet-hub-windows-x86_64.exe
            bundles: msi,nsis
            run_tests: true

          - name: Windows ARM64
            os: windows-11-arm
            target: aarch64-pc-windows-msvc
            artifact_name: release-windows-arm64
            hub_bin: clipnet-hub.exe
            hub_asset: clipnet-hub-windows-arm64.exe
            bundles: nsis
            run_tests: true

          - name: Ubuntu/Debian x86_64
            os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            artifact_name: release-linux-x86_64
            hub_bin: clipnet-hub
            hub_asset: clipnet-hub-linux-x86_64
            bundles: deb,appimage
            run_tests: true

          - name: Ubuntu/Debian ARM64
            os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            artifact_name: release-linux-arm64
            hub_bin: clipnet-hub
            hub_asset: clipnet-hub-linux-arm64
            bundles: deb,appimage
            run_tests: true

          - name: macOS Apple Silicon (ARM64)
            os: macos-latest
            target: aarch64-apple-darwin
            artifact_name: release-macos-arm64
            hub_bin: clipnet-hub
            hub_asset: clipnet-hub-macos-arm64
            bundles: dmg
            run_tests: true

          - name: macOS Intel (x86_64)
            os: macos-latest
            target: x86_64-apple-darwin
            artifact_name: release-macos-x86_64
            hub_bin: clipnet-hub
            hub_asset: clipnet-hub-macos-x86_64
            bundles: dmg
            run_tests: false

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux Tauri dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential pkg-config libssl-dev file curl wget \
            libgtk-3-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev \
            librsvg2-dev libxdo-dev patchelf libx11-dev \
            libxcb1-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.artifact_name }}

      - name: Install frontend dependencies & build UI
        run: |
          npm ci
          npm run build

      - name: Run Rust workspace tests
        if: matrix.run_tests
        run: cargo test --workspace --locked --target ${{ matrix.target }}

      - name: Build standalone clipnet-hub & Tauri bundles
        env:
          NO_STRIP: "true"
          APPIMAGE_EXTRACT_AND_RUN: "1"
          CI: "true"
        run: |
          cargo build --release --locked --target ${{ matrix.target }} -p clipnet-hub
          npm run tauri build -- --target ${{ matrix.target }} --bundles ${{ matrix.bundles }}

      - name: Stage release assets
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          mkdir -p release-assets

          HUB_SRC="target/${{ matrix.target }}/release/${{ matrix.hub_bin }}"
          if [ ! -f "$HUB_SRC" ]; then
            echo "Missing hub binary: $HUB_SRC" >&2
            exit 1
          fi
          cp "$HUB_SRC" "release-assets/${{ matrix.hub_asset }}"

          BUNDLE_ROOT="target/${{ matrix.target }}/release/bundle"
          IFS=',' read -ra BUNDLES <<< "${{ matrix.bundles }}"
          for b in "${BUNDLES[@]}"; do
            case "$b" in
              deb) files=("$BUNDLE_ROOT"/deb/*.deb) ;;
              appimage) files=("$BUNDLE_ROOT"/appimage/*.AppImage) ;;
              msi) files=("$BUNDLE_ROOT"/msi/*.msi) ;;
              nsis) files=("$BUNDLE_ROOT"/nsis/*.exe) ;;
              dmg) files=("$BUNDLE_ROOT"/dmg/*.dmg) ;;
              *) echo "Unsupported bundle kind: $b" >&2; exit 1 ;;
            esac
            if [ "${#files[@]}" -eq 0 ]; then
              echo "No bundle files found for '$b' in $BUNDLE_ROOT" >&2
              exit 1
            fi
            cp "${files[@]}" release-assets/
          done
          ls -lh release-assets/

      - name: Upload package artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: release-assets/*
          retention-days: 30
          if-no-files-found: error

  publish-docker:
    name: Publish clipnet-hub to GHCR
    needs: verify-tag
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/clipnet-hub
          flavor: |
            latest=false
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ !contains(github.ref_name, '-') }}

      - name: Build and push multi-arch Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  create-release:
    name: Create GitHub Release
    needs: [build-packages]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: release-assets
          merge-multiple: true

      - name: Generate SHA-256 checksums
        run: |
          cd release-assets
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          fail_on_unmatched_files: true
